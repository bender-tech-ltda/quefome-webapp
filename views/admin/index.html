<!DOCTYPE html>
<html ng-app="">
	<head>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<title><%= title %></title>

		<link rel="shortcut icon" href="/assets/img/quefome_icon_70x75.png">

		<style type="text/css">
			.ng-cloak {
				display: none
			}
		</style>

		<link rel="stylesheet" href="/components/bootstrap/dist/css/bootstrap.css" />
		<link rel="stylesheet" href="/assets/css/quefome-admin.css" />
	</head>

	<body class="ng-cloak">
		<div class="login-page">
			<div class="quefome-brand">
			</div>

			<div class="login-panel">
				<form name="loginForm">
					<fieldset>
						<legend>Acesso restrito</legend>

						<div class="form-group">
							<div class="input-group">
								<span class="input-group-addon">
									<span class="glyphicon glyphicon-envelope"></span>
								</span>
								<input type="email" class="form-control" placeholder="Email">
							</div>
						</div>

						<div class="form-group">
							<div class="input-group">
								<span class="input-group-addon">
									<span class="glyphicon glyphicon-lock"></span>
								</span>
								<input type="password" class="form-control" placeholder="Senha">
							</div>
						</div>

						<div class="checkbox">
							<label>
								<input type="checkbox" /> Mantenha-me conectado
							</label>
						</div>

						<hr/>

						<button class="btn btn-primary btn-block">Login</button>
					</fieldset>
				</form>
			</div>
		</div>

		<!--div class="content" ng-view></div-->

		<script src="/components/requirejs/require.js" data-main="/assets/js/quefome/admin/main.js"></script>
	</body>
</html>
