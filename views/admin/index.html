<!DOCTYPE html>
<html ng-app="">
	<head>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<title><%= title %></title>

		<link rel="shortcut icon" href="/assets/img/quefome_icon_70x75.png">

		<style type="text/css">
			.ng-cloak {
				display: none
			}
		</style>

		<link rel="stylesheet" href="/components/bootstrap/dist/css/bootstrap.css" />
		<link rel="stylesheet" href="/assets/css/quefome-admin.css" />
	</head>

	<body class="ng-cloak">
		<% include partials/login/login.html %>

		<div class="ng-cloak" ng-show="hasCheckedForLoggedUser() && isUserLogged()">

					<div class="navbar-header">
						<button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#navbar">

						<a class="navbar-brand" href="#/">Quefo.me</a>

						<ul class="nav navbar-nav navbar-right">

						</ul>
					</div>
				</div>
			</nav>

			<div class="row">

					<ul class="nav nav-sidebar">
						<li class="active"><a href="#/">Pedidos</a></li>

				</div>

				<div class="content col-sm-9 col-sm-offset-3 col-md-10 col-md-offset-2" ng-view></div>

		<script src="/components/requirejs/require.js" data-main="/assets/js/quefome/admin/main.js"></script>
