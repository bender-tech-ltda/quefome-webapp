<div class="ng-cloak login-page" ng-controller="LoginController" ng-hide="!hasCheckedForLoggedUser() || isLogged()">
	<div class="quefome-brand"></div>

	<div class="login-panel">
		<form name="loginForm" ng-submit="login()" novalidate>
			<fieldset>
				<legend>Acesso restrito</legend>

				<div class="alert alert-danger" ng-show="errorMessage">
					{{errorMessage}}
				</div>

				<div class="form-group">
					<div class="input-group">
						<span class="input-group-addon" ng-class="{disabled: processing}">
							<span class="qf-icon icon-email"></span>
						</span>
						<input type="email" class="form-control" name="email" placeholder="Email" ng-model="email" ng-disabled="processing" required />
					</div>
				</div>

				<div class="form-group">
					<div class="input-group">
						<span class="input-group-addon" ng-class="{disabled: processing}">
							<span class="qf-icon icon-lock"></span>
						</span>
						<input type="password" class="form-control" name="password" placeholder="Senha" ng-model="password" ng-disabled="processing" required />
					</div>
				</div>

				<div class="checkbox">
					<label>
						<input type="checkbox" name="keepLoggedIn" ng-model="keepLoggedIn" ng-disabled="processing" /> Mantenha-me conectado
					</label>
				</div>

				<hr/>

				<button type="submit" class="btn btn-primary btn-block" ng-disabled="processing">
					<span ng-hide="processing">Login</span>
					<span class="qf-icon icon-loading spin" ng-show="processing"></span>
				</button>
			</fieldset>
		</form>
	</div>
</div>
