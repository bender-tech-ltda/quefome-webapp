<!DOCTYPE html>
<html ng-app="">
	<head>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<title>Quefo.me</title>

		<link rel="shortcut icon" href="/assets/img/quefome_icon_70x75.png">

		<style type="text/css">
			.ng-cloak {
				display: none
			}
		</style>

		<link rel="stylesheet" href="/components/bootstrap/dist/css/bootstrap.css" />
		<link rel="stylesheet" href="/assets/css/quefome.css" />
		<link rel="stylesheet" href="/assets/css/quefome-icons.css" />
	</head>

	<body class="ng-cloak">
		<nav class="navbar navbar-default navbar-quefome navbar-static-top">
			<div class="container">
				<div class="navbar-header">
					<button class="navbar-toggle collapsed" data-target="#user-menu" data-toggle="collapse" type="button">
						<span class="icon-bar"></span>
						<span class="icon-bar"></span>
						<span class="icon-bar"></span>
					</button>
					<a class="navbar-brand navbar-quefome-brand" qf-href="/"></a>
				</div>

				<div id="user-menu" class="navbar-collapse collapse">
					<ul class="nav navbar-nav navbar-right" ng-controller="UserMenuController">
						<li ng-hide="isUserLogged()" class="login-quefome-icon">
							<a href="javascript:void(0);" qf-click-dialog-url="{{loginView}}">Login | Cadastre-se</a>
						</li>
						<li ng-show="isUserLogged()" class="login-quefome-icon">
							<a href="javascript:void(0);" ng-click="logoutUser()">Sair</a>
						</li>
					</ul>
				</div>
			</div>
		</nav>

		<div class="loading-route-panel" ng-show="$app.route.loading">
			<span class="qf-icon icon-loading spin"></span>
			<p ng-show="$app.route.loadingMessage">{{$app.route.loadingMessage}}</p>
		</div>

		<div class="content" ng-hide="$app.route.loading" ng-view></div>

		<footer class="footer">
			<a class="new-delivery" href="<%= landingPageUrl %>" target="_blank" title="Clique aqui para saber como ter seu restaurante no Quefo.me">
				<span class="qf-icon icon-home"></span>
			</a>
			<div class="social-networks">
				<a class="facebook-link" href="<%= social.facebookPageUrl %>" target="_blank" title="Siga nossa página no Facebook">
					<span class="qf-icon icon-facebook-round"></span>
				</a>
				<a class="twitter-link" href="<%= social.twitterPageUrl %>" target="_blank" title="Siga nossa página no Twitter">
					<span class="qf-icon icon-twitter"></span>
				</a>
			</div>
		</footer>

		<script src="/components/requirejs/require.js" data-main="/assets/js/quefome/main.js"></script>
	</body>
</html>
