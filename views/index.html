<!DOCTYPE html>
<html ng-app="">
	<head>
		<meta name="viewport" content="width=device-width, initial-scale=1" />

		<title>Quefo.me</title>
		<link rel="stylesheet" href="/components/bootstrap/dist/css/bootstrap.css"></link>
		<link rel="stylesheet" href="/assets/css/quefome.css"></link>
	</head>

	<body>
		<nav class="navbar navbar-inverse navbar-fixed-top">
			<div class="container">
				<div class="navbar-header">
					<button class="navbar-toggle collapsed" data-target="#user-menu" data-toggle="collapse" type="button">
						<span class="icon-bar"></span>
						<span class="icon-bar"></span>
						<span class="icon-bar"></span>
					</button>
					<a class="navbar-brand" qf-href="/">Quefo.me</a>
				</div>

				<div id="user-menu" class="navbar-collapse collapse">
					<ul class="nav navbar-nav navbar-right" ng-controller="UserMenuController">
						<li ng-hide="isUserLogged()">
							<a href="javascript:void(0);" qf-click-dialog-url="{{loginView}}">Entrar</a>
						</li>
						<li ng-show="isUserLogged()">
							<a href="javascript:void(0);" ng-click="logout()">Sair</a>
						</li>
					</ul>
				</div>
			</div>
		</nav>


		<div class="content" ng-view></div>

		<script src="/components/requirejs/require.js" data-main="/assets/js/main.js"></script>
	</body>
</html>
