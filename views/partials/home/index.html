<div class="delivery-search-panel banner-burger">
	<div class="food-type-search">
		<h3 class="title">Você tem fome de quê?</h3>

		<ul class="food-type-list">
			<li class="helper-no-select" ng-repeat="productType in productTypes">
				<a qf-href="/establishments/search?productType={{productType.name}}">
					<span class="qf-icon icon-{{productType.iconName ? productType.iconName : 'question'}}"></span>
					<br/>
					<span>{{productType.name}}</span>
				</a>
			</li>
		</ul>
	</div>

	<form name="querySearchForm" class="query-search">
		<h3 class="title">Procure pelo seu restaurante favorito</h3>

		<input type="text" class="query-field" name="query" ng-model="searchFilter.query" placeholder="Qual o nome do restaurante?" qf-autocomplete qf-fetch-function="searchEstablishmentsNames($query, $callback)" qf-on-select-item="querySearchForm.$submit()"/>

		<button type="submit" class="query-button">Pesquisar</button>
	</form>
</div>

<div>
	<br/><br/><br/><br/><br/><br/><br/><br/>
</div>
