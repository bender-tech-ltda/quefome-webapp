<div class="delivery-search-panel banner-burger">
	<div class="food-type-search">
		<h3>Que fome você tem?</h3>

		<ul class="food-type-list">
			<li class="helper-no-select" ng-repeat="productType in productTypes">
				<a qf-href="/establishments/search?productType={{productType.name}}">
					<span class="qf-icon icon-{{productType.iconName ? productType.iconName : 'question'}}"></span>
					<br/>
					<span>{{productType.name}}</span>
				</a>
			</li>
		</ul>
	</div>
</div>
