<div class="home-page">
	<div class="delivery-search-panel" qf-random-class="banner-burger, banner-pizza">
		<div class="food-type-search">
			<h1 class="title">Você tem fome de quê?</h1>

			<div class="loading" ng-show="loadingProductTypes">
				<span class="qf-icon icon-loading spin"></span>
				<p class="message">Segura aí que estamos buscando nossos melhores rangos...</p>
			</div>

			<ul class="food-type-list" ng-hide="loadingProductTypes">
				<li class="helper-no-select" ng-repeat="productType in productTypes | filter: {important: true}">
					<a href="/establishments/search?productType={{productType.name}}">
						<span class="qf-icon icon-{{productType.iconName ? productType.iconName : 'question'}}"></span>
						<br/>
						<h3>{{productType.name}}</h3>
					</a>
				</li>
			</ul>
		</div>

		<form name="querySearchForm" class="query-search" ng-submit="searchEstablishments()">
			<h2 class="title">Procure pelo seu restaurante favorito</h2>

			<input type="text" class="query-field" name="query" ng-model="query" placeholder="Qual o nome do restaurante?" qf-autocomplete qf-fetch-function="searchEstablishmentsNames($query, $callback)" qf-on-select-item="querySearchForm.$submit()"/>

			<button type="submit" class="btn btn-primary query-button" ng-disabled="searchingEstablishments">
				<span ng-hide="searchingEstablishments">Pesquisar</span>
				<span class="qf-icon icon-search" ng-hide="searchingEstablishments"></span>

				<span ng-show="searchingEstablishments">Pesquisando...</span>
				<span class="qf-icon icon-loading spin" ng-show="searchingEstablishments"></span>
			</button>
		</form>

		<div class="clearfix"></div>
	</div>

	<div class="order-process-panel">
		<h4 class="title">Como funciona?</h4>
		<div class="divider"></div>

		<div class="step choose-establishment-step">
			<span class="qf-icon icon-restaurant"></span>
			<h6>Escolha um restaurante</h6>
		</div>

		<div class="next-step-divider">
			<span class="qf-icon icon-arrow-next"></span>
		</div>

		<div class="step customize-order-step">
			<span class="qf-icon icon-order-check"></span>
			<h6>Monte seu pedido</h6>
		</div>

		<div class="next-step-divider">
			<span class="qf-icon icon-arrow-next"></span>
		</div>

		<div class="step wait-order-step">
			<span class="qf-icon icon-food"></span>
			<h6>E espere ele ficar pronto</h6>
		</div>

		<div class="clearfix"></div>
	</div>
</div>
