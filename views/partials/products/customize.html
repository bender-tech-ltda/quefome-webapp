<form class="customize-product-dialog" name="productForm" ng-controller="CustomizeProductController">
	<div class="modal-body">
		<div class="product">
			<div class="info">
				<h3 class="name">{{product.name}}</h3>
				<p class="description">{{product.description}}</p>
			</div>
		</div>

		<div class="product-components" ng-show="componentCategories && componentCategories.length > 0">
			<fieldset class="component-category" ng-repeat="category in componentCategories | orderBy: ['sequence', 'name']">
				<legend class="title">{{category.name}}</legend>

				<div class="component" ng-repeat="component in category.components | orderBy: ['sequence', 'name']">
					<div class="checkbox" ng-hide="component.options && component.options.length > 0">
						<label>
							<input type="checkbox" ng-model="component.value"/>

							<span>{{component.name}}</span>
							<p class="price" ng-show="component.price && component.price > 0"> + R$ {{component.price | money}}</p>
						</label>
					</div>

					<div class="radio" ng-show="component.options && component.options.length > 0" ng-repeat="option in component.options | orderBy: ['sequence', 'name']">
						<label>
							<input type="radio" ng-model="component.option" ng-value="option" />

							<span>{{option.name}}</span>
							<p class="price" ng-show="option.price && option.price > 0">+ R$ {{option.price | money}}</p>						
						</label>
					</div>
				</div>
			</fieldset>
		</div>
	</div>

	<div class="modal-footer">
		<div class="quantity">
			<label>Quantidade:</label>
			<input type="number" class="form-control" name="quantity" ng-model="quantity" required min="1" />
		</div>

		<div class="total">
			<b>Total:</b>
			<span class="price">R$ {{calculateTotalPrice() | money}}</span>
		</div>

		<div class="clearfix"></div>

		<button class="btn btn-primary btn-add-product">Adicionar ao Pedido</button>
	</div>
</form>
