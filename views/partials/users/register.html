<div class="register-dialog" ng-controller="NewUserController">
	<div class="modal-header">
		<button type="button" class="close" data-dismiss="modal">&times;</button>
		<h4 class="modal-title">Cadastre-se</h4>
	</div>
	<div class="modal-body clearfix">
		<form ng-submit="saveAndLogin()" class="register-form" name="form" novalidate>
			<fieldset>
				<div class="alert alert-danger" ng-show="errorMessage">
					<b>{{errorMessage}}</b>
				</div>

				<div class="form-group">
					<label for="name">Nome</label>
					<input class="form-control" type="text" name="name" placeholder="Nome" ng-disabled="processing" ng-model="user.name" required />
					<span class="help-block">Você pode informar apenas seu nome e seu sobrenome.</span>
				</div>

				<div class="form-group">
					<label for="email">Email</label>
					<input class="form-control" type="email" name="email" placeholder="Email" ng-disabled="processing" ng-model="user.email" required />
				</div>

				<div class="form-group">
					<label for="password">Senha</label>
					<input class="form-control" type="password" name="password" placeholder="Senha" autocomplete="off" ng-disabled="processing" ng-model="user.password" required ng-minlength="6" ng-maxlength="20" />
					<span class="help-block">A senha deve possuir entre 6 e 20 caracteres.</span>
				</div>

				<br/>

				<button class="btn btn-block btn-default" type="submit" ng-disabled="processing">
					<span ng-hide="processing">Cadastrar</span>
					<span class="qf-icon icon-loading spin" ng-show="processing"></span>
				</button>
			</fieldset>
		</form>

		<div class="login-panel-xs visible-xs text-center">
			<hr/>

			<h4>
				<span>Já possui cadastro?</span>
				<a href="javascript:void(0)" ng-click="showLoginDialog()" ng-class="{disabled: processing}">Faça o login</a>
			</h4>
		</div>

		<div class="login-panel hidden-xs">
			<h4>Já possui cadastro?</h4>

			<button type="button" class="btn btn-primary" ng-click="showLoginDialog()" ng-disabled="processing">Faça o login</button>
		</div>
	</div>
</div>
