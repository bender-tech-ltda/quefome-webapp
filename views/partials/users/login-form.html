<form ng-controller="LoginController" ng-submit="login()" class="login-form" name="form" novalidate>
	<fieldset>
		<legend>Já sou cadastrado</legend>

		<div class="alert alert-danger" ng-show="errorMessage">
			<b>{{errorMessage}}</b>
		</div>

		<div class="form-group">
			<label for="email">Email</label>
			<input class="form-control" type="email" name="email" placeholder="email@dominio.com" ng-disabled="processing" ng-model="email" required />
		</div>

		<div class="form-group">
			<label for="password">Senha</label>
			<input class="form-control" type="password" name="password" placeholder="Senha" ng-disabled="processing" ng-model="password" required />
		</div>

		<div class="checkbox">
			<label>
				<input type="checkbox" ng-model="keepLoggedIn" />
				<span>manter-me conectado</span>
			</label>
		</div>

		<button class="btn btn-block btn-primary" type="submit" ng-disabled="processing">Entrar</button>
	</fieldset>
</form>
