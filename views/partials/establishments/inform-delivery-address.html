<qf-modal qf-modal-open-on-load="true">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-header">
				<h4 class="modal-title">Informe o endereço de entrega</h4>
			</div>
			<div class="modal-body">
				<form name="form" ng-controller="InformDeliveryAddressController" novalidate>
					<div class="row">
						<div class="col-xs-12 col-sm-6">
							<label for="zipCode">CEP</label>
							<input type="tel" class="form-control" name="zipCode" placeholder="CEP" pattern="[0-9]{5}(-){0,1}[0-9]{3}" required ng-model="order.address.zipCode" qf-show-validation-state/>
						</div>
					</div>

					<hr />

					<div class="row">
						<div class="col-xs-6">
							<label>Estado</label>
							<p class="form-control-static">Rio Grande do Sul</p>
						</div>

						<div class="col-xs-6">
							<label>Cidade</label>
							<p class="form-control-static">Porto Alegre</p>
						</div>
					</div>

					<br/>

					<div class="row">
						<div class="col-xs-12">
							<label for="neighborhood">Bairro</label>
							<select name="neighborhood" class="form-control" ng-model="order.address.neighborhood" ng-options="neighborhood.name for neighborhood in neighborhoods track by neighborhood.id" required qf-show-validation-state>
								<option value="">Selecione um bairro...</option>
							</select>
						</div>
					</div>

					<br/>

					<div class="row">
						<div class="col-xs-12">
							<label for="address">Endereço</label>
							<input type="text" class="form-control" name="address" placeholder="Rua, Avenida, etc." required ng-model="order.address.address" qf-show-validation-state/>
						</div>
					</div>

					<br/>

					<div class="row">
						<div class="col-xs-12 col-sm-6">
							<label for="number">Número</label>
							<input type="number" class="form-control" name="number" placeholder="Número" ng-model="order.address.number" required qf-show-validation-state/>
						</div>

						<div class="col-xs-12 col-sm-6">
							<label for="complement">Complemento</label>
							<input type="text" class="form-control" name="complement" placeholder="Complemento" ng-model="order.address.complement" qf-show-validation-state/>
						</div>
					</div>
				</form>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-default disabled" data-dismiss="modal">Finalizar pedido!</button>
			</div>
		</div>
	</div>
</qf-modal>
