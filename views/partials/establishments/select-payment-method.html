<qf-modal qf-modal-open-on-load="true">
	<div class="modal-dialog">
		<div class="modal-content">
			<div class="modal-header">
				<h4 class="modal-title">Selecione a forma de pagamento</h4>
			</div>
			<div class="modal-body">
				<form name="form">
					<div class="row">
						<fieldset class="col-sm-12 col-md-6" ng-repeat="category in paymentCategories">
							<legend style="margin-bottom: 0px;">{{category.name}} <span class="pull-right qf-icon icon-{{category.key}}"></span></legend>

							<div ng-repeat="method in category.paymentMethods">
								<div class="col-xs-12">
									<div class="radio">
										<label title="{{method.name}} - {{category.name}}">
											<input type="radio" name="paymentMethod" ng-model="order.paymentMethod" ng-value="method" /> {{method.name}}
										</label>
									</div>
								</div>

								<div ng-show="category.hasChange && isPaymentMethodSelected(method)">
									<div class="col-xs-12">
										<label>Troco para?</label>

										<div class="input-group">
											<span class="input-group-addon" id="basic-addon1">R$</span>
											<input type="number" class="form-control" name="change" placeholder="0.00" ng-model="order.change" min="0.00" step="10" pattern=""/>
										</div>

										<span class="help-block">Deixe em branco caso não precise de troco</span>
									</div>
								</div>
							</div>
						</fieldset>
					</div>
				</form>
			</div>
			<div class="modal-footer">
				<button type="button" class="btn btn-default disabled" data-dismiss="modal">Finalizar pedido!</button>
			</div>
		</div>
	</div>
</qf-modal>
